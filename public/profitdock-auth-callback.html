<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>Finalizing your ProfitDock sign-in...</title>
        <style>
            :root {
                color-scheme: light;
                font-family: Inter, Arial, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: #ffffff;
                color: #1f2937;
                overflow: hidden;
            }

            .auth-callback {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: grid;
                place-items: center;
                overflow: hidden;
                background: #ffffff;
                text-align: center;
            }

            .auth-callback__icon-cloud,
            .auth-callback__center-stage,
            .auth-callback__red-spread,
            .auth-callback__content {
                position: absolute;
                inset: 0;
            }

            .auth-callback__icon-cloud {
                z-index: 1;
            }

            .auth-callback__trade-icon {
                --start-x: 0vw;
                --start-y: 0vh;
                position: absolute;
                left: 50%;
                top: 50%;
                width: clamp(5.8rem, 10vw, 9.6rem);
                height: clamp(5.8rem, 10vw, 9.6rem);
                display: grid;
                place-items: center;
                background: transparent;
                box-shadow: none;
                opacity: 0;
                transform: translate(var(--start-x), var(--start-y)) scale(0);
                animation: auth-icon-converge 1.4s cubic-bezier(0.32, 0.72, 0.2, 1) forwards;
            }

            .auth-callback__trade-icon svg {
                width: 100%;
                height: 100%;
                filter: drop-shadow(0 1.4rem 2.4rem rgba(16, 35, 63, 0.16));
            }

            .auth-callback__trade-icon--matches {
                --start-x: min(-31rem, -34vw);
                --start-y: min(-18rem, -26vh);
                z-index: 4;
            }

            .auth-callback__trade-icon--even {
                --start-x: max(31rem, 34vw);
                --start-y: min(-18rem, -26vh);
                z-index: 2;
            }

            .auth-callback__trade-icon--over {
                --start-x: min(-31rem, -34vw);
                --start-y: max(18rem, 26vh);
                z-index: 1;
            }

            .auth-callback__trade-icon--rise {
                --start-x: max(31rem, 34vw);
                --start-y: max(18rem, 26vh);
                z-index: 3;
            }

            .auth-callback--success .auth-callback__icon-cloud {
                animation: auth-icon-cover-fade 0.24s ease-out 0.72s forwards;
            }

            .auth-callback--success .auth-callback__trade-icon:not(.auth-callback__trade-icon--matches) {
                animation: auth-icon-collision-dismiss 0.16s ease-out forwards;
            }

            .auth-callback--success .auth-callback__trade-icon--matches {
                animation: auth-match-impact-spin 0.72s cubic-bezier(0.24, 0.82, 0.2, 1) forwards;
            }

            .auth-callback--error .auth-callback__trade-icon {
                animation: auth-icon-error-pulse 0.55s ease-out forwards;
            }

            .auth-callback__impact-ring {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 10rem;
                height: 10rem;
                border: 0.35rem solid rgba(255, 255, 255, 0.95);
                border-radius: 50%;
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
                animation: auth-impact-ring 0.2s ease-out 1.2s forwards;
                filter: drop-shadow(0 0 2.4rem rgba(255, 255, 255, 0.92));
            }

            .auth-callback__red-spread {
                z-index: 2;
                background: #ff444f;
                clip-path: circle(0% at 50% 50%);
                opacity: 0;
                pointer-events: none;
            }

            .auth-callback--success .auth-callback__red-spread {
                animation: auth-red-spread 0.56s ease-out 0.68s forwards;
            }

            .auth-callback--success.auth-callback--exiting .auth-callback__red-spread {
                animation: auth-red-contract 0.4s ease-in forwards;
            }

            .auth-callback__content {
                z-index: 3;
                padding: 2.4rem;
                pointer-events: none;
            }

            .auth-callback__brand-stack {
                position: absolute;
                left: 50%;
                top: 50%;
                width: min(52rem, calc(100vw - 3.2rem));
                display: grid;
                justify-items: center;
                gap: 1.4rem;
                color: #ffffff;
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }

            .auth-callback--success .auth-callback__brand-stack {
                animation: auth-brand-in 0.58s cubic-bezier(0.2, 1.26, 0.36, 1) 1.3s forwards;
            }

            .auth-callback--success.auth-callback--exiting .auth-callback__brand-stack {
                animation: auth-brand-out 0.36s ease-in forwards;
            }

            .auth-callback__brand-mark {
                position: relative;
                width: clamp(7.2rem, 15vw, 12rem);
                height: clamp(7.2rem, 15vw, 12rem);
                display: grid;
                place-items: center;
            }

            .auth-callback__brand-mark::before {
                content: '';
                position: absolute;
                inset: -1.4rem;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.18);
                opacity: 0;
                animation: auth-logo-glow 1.2s ease-out 1.58s forwards;
            }

            .auth-callback__brand-mark svg {
                width: 100%;
                height: 100%;
                filter: drop-shadow(0 1.4rem 3rem rgba(141, 20, 27, 0.32));
            }

            .auth-callback__status-stack {
                display: grid;
                justify-items: center;
                gap: 0.5rem;
            }

            .auth-callback__title,
            .auth-callback__message {
                color: inherit;
                margin: 0;
                opacity: 0;
                transform: translateY(0.8rem);
            }

            .auth-callback__title {
                font-size: clamp(2rem, 4vw, 2.9rem);
                font-weight: 800;
            }

            .auth-callback__message {
                font-size: clamp(1.45rem, 2.8vw, 1.8rem);
                font-weight: 600;
                line-height: 1.45;
            }

            .auth-callback--success .auth-callback__title {
                animation: auth-status-line 0.38s ease-out 1.94s forwards;
            }

            .auth-callback--success .auth-callback__message {
                animation: auth-status-line 0.38s ease-out 2.26s forwards;
            }

            .auth-callback__three-dot-loader {
                display: inline-flex;
                gap: 0.48rem;
                margin-top: 0.55rem;
                opacity: 0;
            }

            .auth-callback--success .auth-callback__three-dot-loader {
                animation: auth-loader-in 0.28s ease-out 2.54s forwards;
            }

            .auth-callback__three-dot-loader span {
                width: 0.62rem;
                height: 0.62rem;
                border-radius: 999px;
                background: #ffffff;
                animation: auth-dot-pulse 0.9s ease-in-out infinite;
            }

            .auth-callback__three-dot-loader span:nth-child(2) {
                animation-delay: 0.12s;
            }

            .auth-callback__three-dot-loader span:nth-child(3) {
                animation-delay: 0.24s;
            }

            .auth-callback__error-panel {
                position: relative;
                z-index: 3;
                width: min(42rem, calc(100vw - 3.2rem));
                padding: 2.4rem;
                border: 1px solid rgba(255, 68, 79, 0.22);
                border-radius: 2.2rem;
                background: #ffffff;
                box-shadow: 0 2.4rem 5.5rem rgba(16, 35, 63, 0.14);
                opacity: 0;
                pointer-events: none;
                transform: translateY(1.2rem);
            }

            .auth-callback--error .auth-callback__error-panel {
                animation: auth-error-panel-in 0.32s ease-out 0.44s forwards;
                pointer-events: auto;
            }

            .auth-callback--error .auth-callback__error-panel .auth-callback__title,
            .auth-callback--error .auth-callback__error-panel .auth-callback__message {
                color: #1f2937;
                opacity: 1;
                transform: none;
            }

            .auth-callback--error .auth-callback__brand-stack,
            .auth-callback--error .auth-callback__red-spread {
                display: none;
            }

            .auth-callback__actions {
                margin-top: 2.4rem;
            }

            .auth-callback__button {
                appearance: none;
                border: 0;
                border-radius: 1.2rem;
                background: #ff444f;
                color: #ffffff;
                cursor: pointer;
                font-size: 1.6rem;
                font-weight: 700;
                padding: 1.2rem 2rem;
            }

            @keyframes auth-icon-converge {
                0% {
                    opacity: 0;
                    transform: translate(var(--start-x), var(--start-y)) scale(0);
                }

                28% {
                    opacity: 1;
                    transform: translate(var(--start-x), var(--start-y)) scale(1);
                }

                42% {
                    opacity: 1;
                    transform: translate(var(--start-x), var(--start-y)) scale(1);
                }

                100% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0.6);
                }
            }

            @keyframes auth-impact-ring {
                0% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0);
                }

                100% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(1.5);
                }
            }

            @keyframes auth-icon-cover-fade {
                to {
                    opacity: 0;
                }
            }

            @keyframes auth-icon-collision-dismiss {
                from {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0.6);
                }

                to {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0.2);
                }
            }

            @keyframes auth-match-impact-spin {
                0% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
                }

                72% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0.7) rotate(900deg);
                }

                100% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0.6) rotate(1080deg);
                }
            }

            @keyframes auth-icon-error-pulse {
                0%, 100% {
                    filter: drop-shadow(0 0 0 rgba(255, 68, 79, 0));
                }

                35%, 70% {
                    filter: drop-shadow(0 0 2rem rgba(255, 68, 79, 0.8));
                }
            }

            @keyframes auth-red-spread {
                0% {
                    clip-path: circle(0% at 50% 50%);
                    opacity: 1;
                }

                100% {
                    clip-path: circle(150% at 50% 50%);
                    opacity: 1;
                }
            }

            @keyframes auth-red-contract {
                from {
                    clip-path: circle(150% at 50% 50%);
                    opacity: 1;
                }

                to {
                    clip-path: circle(0% at 50% 50%);
                    opacity: 0;
                }
            }

            @keyframes auth-brand-in {
                0% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0.3);
                }

                72% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1.08);
                }

                100% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
            }

            @keyframes auth-brand-out {
                to {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(1.12);
                }
            }

            @keyframes auth-logo-glow {
                0% {
                    opacity: 0.95;
                    transform: scale(0.72);
                }

                100% {
                    opacity: 0;
                    transform: scale(1.45);
                }
            }

            @keyframes auth-status-line {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes auth-loader-in {
                to {
                    opacity: 1;
                }
            }

            @keyframes auth-dot-pulse {
                0%, 100% {
                    opacity: 0.42;
                    transform: translateY(0);
                }

                50% {
                    opacity: 1;
                    transform: translateY(-0.36rem);
                }
            }

            @keyframes auth-error-panel-in {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <main id="auth-callback" class="auth-callback" aria-live="polite">
            <div class="auth-callback__icon-cloud" aria-hidden="true">
                <span class="auth-callback__trade-icon auth-callback__trade-icon--matches">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32">
                        <path fill="#FF444F" d="m10.01 8.457 5.654 5.658a2.667 2.667 0 0 1 0 3.77l-5.656 5.658-.008-.01a2.65 2.65 0 0 1 0-3.752l2.445-2.448-7.111.016v-2.682h7.111L10 12.22a2.65 2.65 0 0 1 0-3.753zm11.98 0 .01.01a2.65 2.65 0 0 1 0 3.752l-2.445 2.448 7.112-.016v2.682h-7.112l2.447 2.447a2.65 2.65 0 0 1 0 3.753l-.01.01-4.658-4.659.997-.999a2.667 2.667 0 0 0 0-3.77l-.997-.999z" />
                        <path fill="#85ACB0" d="M17.334 21.333v5.334h-2.667v-5.334zm0-16v5.334h-2.667V5.333z" />
                    </svg>
                </span>
                <span class="auth-callback__trade-icon auth-callback__trade-icon--even">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32">
                        <path fill="#85ACB0" d="M13.334 18.667v8h-8v-8zM26.667 5.333v8h-8v-8z" />
                        <path fill="#FF444F" d="M26.667 18.667v8h-8v-8zM13.334 5.333v8h-8v-8z" />
                    </svg>
                </span>
                <span class="auth-callback__trade-icon auth-callback__trade-icon--over">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32">
                        <path fill="#FF444F" d="m12.586 22.667-2.654 2.666H6.115l2.667-2.666zM24 6.667a2.667 2.667 0 0 1 2.667 2.666v8h-.013A2.653 2.653 0 0 1 24 14.68v-3.467l-8 8.027v-3.792l6.115-6.115h-3.461A2.653 2.653 0 0 1 16 6.68v-.013z" />
                        <path fill="#85ACB0" d="M26.667 20H5.334v2.667h21.333z" />
                    </svg>
                </span>
                <span class="auth-callback__trade-icon auth-callback__trade-icon--rise">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32">
                        <path fill="#FF444F" d="M24 5.333h-6.666v.014A2.653 2.653 0 0 0 19.987 8h2.133L10.667 19.448v3.77L24 9.886v2.134a2.653 2.653 0 0 0 2.654 2.648h.013V8A2.667 2.667 0 0 0 24 5.333" />
                        <path fill="#85ACB0" d="M7.219 26.667H5.333V24h4.553z" />
                    </svg>
                </span>
                <span class="auth-callback__impact-ring"></span>
            </div>
            <div class="auth-callback__red-spread" aria-hidden="true"></div>
            <div class="auth-callback__content">
                <div class="auth-callback__brand-stack">
                    <div class="auth-callback__brand-mark" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path fill="#ffffff" d="m15.056 4.972-.774 4.389h-2.686c-2.507 0-4.895 2.03-5.338 4.537l-.188 1.066c-.44 2.507 1.232 4.537 3.738 4.537h2.24c1.827 0 3.567-1.479 3.889-3.305L18 4.499l-2.944.473Zm-1.906 10.81c-.1.564-.607 1.023-1.171 1.023h-1.362c-1.126 0-1.88-.914-1.682-2.043l.117-.665c.2-1.126 1.275-2.042 2.402-2.042h2.353l-.657 3.727Z" />
                        </svg>
                    </div>
                    <div class="auth-callback__status-stack">
                        <h1 id="callback-title" class="auth-callback__title">Requesting Deriv token...</h1>
                        <p id="callback-message" class="auth-callback__message">Finalizing your ProfitDock login...</p>
                        <div class="auth-callback__three-dot-loader" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div id="callback-error-panel" class="auth-callback__error-panel">
                    <h2 id="callback-error-title" class="auth-callback__title">Sign-in could not be completed</h2>
                    <p id="callback-error-message" class="auth-callback__message">ProfitDock could not finish signing you in.</p>
                    <div id="callback-actions" class="auth-callback__actions" hidden>
                        <button id="callback-home" class="auth-callback__button" type="button" onclick="window.location.href='/'">
                            Return to ProfitDock
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <script>
            (async function () {
                const RESET_VERSION = 'profitdock-new-oauth-339iXSWkH7NEGne7sMdQT-v10';
                const RESET_KEY = 'profitdock.auth.reset.version';
                const PROFITDOCK_CLIENT_ID = '339iXSWkH7NEGne7sMdQT';
                const callback_node = document.getElementById('auth-callback');
                const title_node = document.getElementById('callback-title');
                const message_node = document.getElementById('callback-message');
                const error_title_node = document.getElementById('callback-error-title');
                const error_message_node = document.getElementById('callback-error-message');
                const actions_node = document.getElementById('callback-actions');
                const animation_start = Date.now();
                const is_https = window.location.protocol === 'https:';
                const secure_suffix = is_https ? '; Secure' : '';
                const is_callback_path = window.location.pathname === '/auth/callback' || window.location.pathname === '/callback';

                const set_message = message => {
                    if (message_node) message_node.textContent = message;
                };

                const show_error = message => {
                    if (callback_node) callback_node.classList.add('auth-callback--error');
                    if (error_title_node) error_title_node.textContent = 'Sign-in could not be completed';
                    if (error_message_node) error_message_node.textContent = message || 'ProfitDock could not finish signing you in.';
                    if (actions_node) actions_node.hidden = false;
                };

                const wait_for_loader_stage = minimum_ms => {
                    const elapsed = Date.now() - animation_start;
                    return new Promise(resolve => window.setTimeout(resolve, Math.max(0, minimum_ms - elapsed)));
                };

                const redirect_after_success_animation = async redirect_target => {
                    if (!callback_node) {
                        window.location.replace(redirect_target);
                        return;
                    }

                    if (title_node) title_node.textContent = 'Requesting Deriv token...';
                    set_message('Finalizing your ProfitDock login...');
                    await wait_for_loader_stage(1400);
                    callback_node.classList.add('auth-callback--success');
                    await new Promise(resolve => window.setTimeout(resolve, 2600));
                    callback_node.classList.add('auth-callback--exiting');
                    await new Promise(resolve => window.setTimeout(resolve, 420));
                    window.location.replace(redirect_target);
                };

                const set_profitdock_cookie = (name, value) => {
                    document.cookie = `${name}=${value}; path=/; max-age=${60 * 60 * 24 * 30}; SameSite=Lax${secure_suffix}`;
                    document.cookie = `${name}=${value}; path=/; domain=.profitdock.site; max-age=${60 * 60 * 24 * 30}; SameSite=Lax${secure_suffix}`;
                    document.cookie = `${name}=${value}; path=/; domain=profitdock.site; max-age=${60 * 60 * 24 * 30}; SameSite=Lax${secure_suffix}`;
                };

                const clear_logged_state_cookie = () => {
                    ['', '; domain=.profitdock.site', '; domain=profitdock.site'].forEach(domain_suffix => {
                        document.cookie = `logged_state=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/${domain_suffix}`;
                    });
                };

                const clear_auth_storage = () => {
                    [
                        'accountsList',
                        'clientAccounts',
                        'client.accounts',
                        'client_account_details',
                        'authToken',
                        'active_loginid',
                        'callback_token',
                        'profitdock_auth_stage',
                        'client.country',
                        'config.legacy_app_id',
                        'config.socket_app_id',
                        'config.server_url',
                    ].forEach(key => localStorage.removeItem(key));

                    for (let index = localStorage.length - 1; index >= 0; index -= 1) {
                        const key = localStorage.key(index);
                        if (key && /oidc|oauth2|session_state|userManager|auth-client|pkce|deriv_auth/i.test(key)) {
                            localStorage.removeItem(key);
                        }
                    }
                };

                const cleanup_caches = async () => {
                    const cleanup_tasks = [];

                    if ('serviceWorker' in navigator) {
                        cleanup_tasks.push(
                            navigator.serviceWorker.getRegistrations().then(registrations =>
                                Promise.all(registrations.map(registration => registration.unregister()))
                            )
                        );
                    }

                    if ('caches' in window) {
                        cleanup_tasks.push(caches.keys().then(cache_names => Promise.all(cache_names.map(name => caches.delete(name)))));
                    }

                    await Promise.allSettled(cleanup_tasks);
                };

                const is_demo_account = account => account?.account_type === 'demo' || account?.is_virtual === true || /^(VR|VRTC|VRW|DOTD)/i.test(account?.loginid || '');

                const normalize_account = (account, access_token) => {
                    const loginid = String(account?.account_id || account?.id || account?.loginid || '');
                    if (!loginid) return null;

                    return {
                        account_type: account.account_type || (is_demo_account({ ...account, loginid }) ? 'demo' : 'real'),
                        balance: account.balance,
                        created_at: account.created_at,
                        currency: account.currency || '',
                        group: account.group || '',
                        is_virtual: account.account_type === 'demo' || account.is_virtual === true || /^(VR|VRTC|VRW|DOTD)/i.test(loginid),
                        landing_company_name: account.landing_company_name || '',
                        loginid,
                        token: access_token,
                    };
                };

                const get_selected_account = accounts => {
                    const requested = sessionStorage.getItem('query_param_currency') || new URLSearchParams(window.location.search).get('account') || '';
                    const demo = accounts.find(is_demo_account);
                    const real_by_currency = accounts.find(account => !is_demo_account(account) && account.currency?.toUpperCase() === requested.toUpperCase());

                    if (requested === 'demo') return demo || accounts[0];
                    return real_by_currency || accounts.find(account => !is_demo_account(account)) || demo || accounts[0];
                };

                const get_post_login_redirect = selected_account => {
                    const fallback_url = `${window.location.origin}/`;
                    const stored_redirect_url = localStorage.getItem('config.post_login_redirect_uri') || sessionStorage.getItem('redirect_url') || fallback_url;
                    let redirect_url;

                    try {
                        redirect_url = new URL(stored_redirect_url, fallback_url);
                    } catch {
                        redirect_url = new URL(fallback_url);
                    }

                    if (redirect_url.origin !== window.location.origin || ['/auth/callback', '/callback'].includes(redirect_url.pathname)) {
                        redirect_url = new URL(fallback_url);
                    }

                    if (selected_account) {
                        redirect_url.searchParams.set('account', is_demo_account(selected_account) ? 'demo' : selected_account.currency || 'USD');
                    }

                    [
                        'acct1', 'acct2', 'acct3', 'token1', 'token2', 'token3', 'cur1', 'cur2', 'cur3',
                        'code', 'state', 'session_state', 'scope', 'error', 'error_description', 'error_uri',
                    ].forEach(param => redirect_url.searchParams.delete(param));

                    sessionStorage.removeItem('redirect_url');
                    localStorage.removeItem('config.post_login_redirect_uri');

                    return redirect_url.toString();
                };

                const store_oauth_session = ({ access_token, accounts }) => {
                    const normalized_accounts = accounts.map(account => normalize_account(account, access_token)).filter(Boolean);

                    if (!access_token || !normalized_accounts.length) {
                        throw new Error('ProfitDock could not load your Deriv trading accounts. Please try signing in again.');
                    }

                    const selected_account = get_selected_account(normalized_accounts);
                    if (!selected_account) {
                        throw new Error('ProfitDock could not select a Deriv trading account for this session.');
                    }

                    const accounts_list = normalized_accounts.reduce((acc, account) => {
                        acc[account.loginid] = access_token;
                        return acc;
                    }, {});
                    const client_accounts = normalized_accounts.reduce((acc, account) => {
                        acc[account.loginid] = {
                            account_type: account.account_type,
                            currency: account.currency || '',
                            is_virtual: account.is_virtual,
                            loginid: account.loginid,
                            token: access_token,
                        };
                        return acc;
                    }, {});
                    const account_list = normalized_accounts.map(account => ({
                        account_type: account.account_type,
                        balance: account.balance,
                        created_at: account.created_at,
                        currency: account.currency || '',
                        group: account.group,
                        is_virtual: account.is_virtual,
                        landing_company_name: account.landing_company_name,
                        loginid: account.loginid,
                    }));
                    const callback_token = {
                        account_list,
                        country: '',
                        currency: selected_account.currency || '',
                        loginid: selected_account.loginid,
                        token_type: 'oauth',
                    };

                    localStorage.setItem('config.app_id', PROFITDOCK_CLIENT_ID);
                    localStorage.removeItem('config.legacy_app_id');
                    localStorage.setItem(RESET_KEY, RESET_VERSION);
                    localStorage.setItem('accountsList', JSON.stringify(accounts_list));
                    localStorage.setItem('clientAccounts', JSON.stringify(client_accounts));
                    localStorage.setItem('client.accounts', JSON.stringify(account_list));
                    localStorage.setItem('client_account_details', JSON.stringify(account_list));
                    localStorage.setItem('authToken', access_token);
                    localStorage.setItem('active_loginid', selected_account.loginid);
                    localStorage.setItem('client.country', '');
                    localStorage.setItem('callback_token', JSON.stringify(callback_token));
                    localStorage.setItem('profitdock_auth_stage', 'new_oauth_callback_ready');
                    set_profitdock_cookie('logged_state', 'true');

                    return get_post_login_redirect(selected_account);
                };

                const get_legacy_callback_tokens = params => {
                    const tokens = {};

                    params.forEach((value, key) => {
                        if (/^(acct|token|cur)\d+$/i.test(key)) {
                            tokens[key] = value;
                        }
                    });

                    return tokens.acct1 && tokens.token1 ? tokens : null;
                };

                const normalize_legacy_account = (loginid, token, currency = '') => {
                    if (!loginid || !token) return null;

                    return {
                        account_type: /^(VR|VRTC|VRW)/i.test(loginid) ? 'demo' : 'real',
                        currency,
                        is_virtual: /^(VR|VRTC|VRW)/i.test(loginid),
                        loginid,
                        token,
                    };
                };

                const store_legacy_session = tokens => {
                    const legacy_accounts = [];

                    for (let index = 1; index <= 30; index += 1) {
                        const loginid = tokens[`acct${index}`] || '';
                        const token = tokens[`token${index}`] || '';
                        const currency = tokens[`cur${index}`] || '';
                        const account = normalize_legacy_account(loginid, token, currency);

                        if (account) legacy_accounts.push(account);
                    }

                    if (!legacy_accounts.length) {
                        throw new Error('ProfitDock could not read the Deriv legacy account tokens returned from OAuth.');
                    }

                    const selected_account = get_selected_account(legacy_accounts);

                    if (!selected_account) {
                        throw new Error('ProfitDock could not select a Deriv account for this legacy session.');
                    }

                    const accounts_list = legacy_accounts.reduce((acc, account) => {
                        acc[account.loginid] = account.token;
                        return acc;
                    }, {});
                    const client_accounts = legacy_accounts.reduce((acc, account) => {
                        acc[account.loginid] = account;
                        return acc;
                    }, {});
                    const account_list = legacy_accounts.map(account => ({
                        account_type: account.account_type,
                        currency: account.currency || '',
                        is_virtual: account.is_virtual,
                        loginid: account.loginid,
                    }));
                    const callback_token = {
                        account_list,
                        country: '',
                        currency: selected_account.currency || '',
                        loginid: selected_account.loginid,
                        token_type: 'legacy',
                    };

                    localStorage.setItem('config.app_id', PROFITDOCK_CLIENT_ID);
                    localStorage.removeItem('config.legacy_app_id');
                    localStorage.setItem(RESET_KEY, RESET_VERSION);
                    localStorage.setItem('accountsList', JSON.stringify(accounts_list));
                    localStorage.setItem('clientAccounts', JSON.stringify(client_accounts));
                    localStorage.setItem('client.accounts', JSON.stringify(account_list));
                    localStorage.setItem('client_account_details', JSON.stringify(account_list));
                    localStorage.setItem('authToken', selected_account.token);
                    localStorage.setItem('active_loginid', selected_account.loginid);
                    localStorage.setItem('client.country', '');
                    localStorage.setItem('callback_token', JSON.stringify(callback_token));
                    localStorage.setItem('profitdock_auth_stage', 'legacy_callback_ready');
                    set_profitdock_cookie('logged_state', 'true');

                    return get_post_login_redirect(selected_account);
                };

                try {
                    if (window.location.hostname === 'www.profitdock.site') {
                        const canonical_url = new URL(window.location.href);
                        canonical_url.hostname = 'profitdock.site';
                        window.location.replace(canonical_url.toString());
                        return;
                    }

                    if (!is_callback_path) {
                        window.location.replace('/');
                        return;
                    }

                    const params = new URLSearchParams(window.location.search);
                    const hash_params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
                    const error = params.get('error');
                    const error_description = params.get('error_description');
                    const code = params.get('code') || '';
                    const state = params.get('state') || '';
                    const direct_access_token =
                        params.get('access_token') ||
                        hash_params.get('access_token') ||
                        params.get('token') ||
                        hash_params.get('token') ||
                        params.get('token1') ||
                        hash_params.get('token1') ||
                        '';
                    const legacy_tokens = get_legacy_callback_tokens(params);

                    // Remove code and state from URL immediately to prevent back-button/refresh issues
                    if (code || state || direct_access_token) {
                        const clean_url = new URL(window.location.href);
                        ['code', 'state', 'session_state', 'access_token', 'token', 'token1', 'acct1', 'cur1'].forEach(p => clean_url.searchParams.delete(p));
                        window.history.replaceState({}, document.title, clean_url.toString());
                    }

                    // Check if already logged in (e.g. from another tab that just finished)
                    if (localStorage.getItem('authToken') && localStorage.getItem('active_loginid')) {
                        const accounts = JSON.parse(localStorage.getItem('client.accounts') || '[]');
                        if (accounts.length > 0) {
                            window.location.replace(get_post_login_redirect(accounts.find(a => a.loginid === localStorage.getItem('active_loginid')) || accounts[0]));
                            return;
                        }
                    }

                    // Prevent duplicate fetch in the same session
                    if (code && sessionStorage.getItem('processed_oauth_code') === code) {
                        show_error('This sign-in link was already used. Please go back to ProfitDock and start again.');
                        return;
                    }
                    if (code) {
                        sessionStorage.setItem('processed_oauth_code', code);
                    }

                    clear_auth_storage();

                    if (error) {
                        clear_logged_state_cookie();
                        show_error(error_description || error);
                        return;
                    }

                    if (legacy_tokens) {
                        clear_logged_state_cookie();
                        show_error('Deriv returned a legacy token callback. Please start login again from ProfitDock so the new Deriv OAuth session can be authorized.');
                        return;
                    }

                    if (!direct_access_token && (!code || !state)) {
                        clear_logged_state_cookie();
                        show_error('Missing Deriv authorization code. Please start login again from ProfitDock.');
                        return;
                    }

                    if (title_node) title_node.textContent = 'Requesting Deriv token...';
                    set_message(direct_access_token ? 'Validating your Deriv trading token...' : 'Requesting Deriv token...');
                    const controller = new AbortController();
                    const timeout = window.setTimeout(() => controller.abort(), 45000);
                    const response = await fetch('/api/deriv/oauth/exchange', {
                        body: JSON.stringify(direct_access_token ? { access_token: direct_access_token } : { code, state }),
                        headers: { 'Content-Type': 'application/json' },
                        method: 'POST',
                        signal: controller.signal,
                    });
                    window.clearTimeout(timeout);
                    const payload = await response.json().catch(() => null);

                    if (!response.ok || !payload?.access_token) {
                        // If another tab succeeded while this one failed, just redirect
                        if (localStorage.getItem('authToken')) {
                            window.location.replace('/');
                            return;
                        }
                        
                        clear_logged_state_cookie();
                        const err_msg = payload?.message || 'ProfitDock could not request Deriv trading tokens.';
                        
                        // User friendly message for the common "already used" error
                        if (err_msg.toLowerCase().includes('already been used') || err_msg.toLowerCase().includes('already used')) {
                            show_error('This sign-in link has already been used. Please return to ProfitDock and click Sign In again.');
                        } else {
                            show_error(err_msg);
                        }
                        return;
                    }

                    if (!Array.isArray(payload.accounts) || !payload.accounts.length) {
                        clear_logged_state_cookie();
                        show_error(payload.accounts_error?.message || 'Deriv did not return a tradable Options account for this login.');
                        return;
                    }

                    set_message('Finalizing your ProfitDock login...');
                    const redirect_target = store_oauth_session({
                        access_token: payload.access_token,
                        accounts: payload.accounts,
                    });

                    set_message('Finalizing your ProfitDock login...');
                    cleanup_caches().catch(error => console.warn('[ProfitDock Callback] Cache cleanup failed:', error));
                    await redirect_after_success_animation(redirect_target);
                } catch (error) {
                    console.error('[ProfitDock Callback] New API callback bootstrap failed:', error);
                    
                    if (localStorage.getItem('authToken')) {
                        window.location.replace('/');
                        return;
                    }
                    
                    clear_logged_state_cookie();
                    localStorage.setItem('profitdock_auth_stage', `new_oauth_callback_error:${error instanceof Error ? error.message : 'unknown'}`);
                    show_error(
                        error instanceof DOMException && error.name === 'AbortError'
                            ? 'ProfitDock sign-in took too long. Please try again.'
                            : error instanceof Error
                              ? error.message
                              : 'ProfitDock could not finish storing your Deriv session. Please try logging in again.'
                    );
                }
            })();
        </script>
    </body>
</html>
